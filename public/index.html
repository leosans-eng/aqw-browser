<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AdventureQuest Worlds</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      color: #fff;
      font-family: "Segoe UI", sans-serif;
    }
    #game {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 960px;
      height: 550px;
      transform-origin: center center;
    }
    #game ruffle-player {
      width: 960px;
      height: 550px;
      display: block;
    }
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #000;
      z-index: 2;
    }
    #status p {
      margin: 0;
      font-size: 18px;
    }
    #status .error {
      max-width: 640px;
      color: #ffb4a8;
      line-height: 1.4;
    }
    #hud {
      position: fixed;
      top: 6px;
      left: 6px;
      z-index: 3;
      padding: 6px 9px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.75);
      font: 12px/1.45 Consolas, monospace;
      white-space: pre;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status"><p>Opening AdventureQuest Worlds…</p></div>
  <div id="game"></div>
  <script src="config.js"></script>
  <script src="vendor/ruffle.js"></script>
  <script src="player.js"></script>
</body>
</html>
