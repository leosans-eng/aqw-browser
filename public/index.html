<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AdventureQuest Worlds</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      color: #fff;
      font-family: "Segoe UI", sans-serif;
    }
    #game {
      position: absolute;
      inset: 0;
      transform-origin: center center;
    }
    #game ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
    }
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: #000;
      z-index: 2;
    }
    #status p {
      margin: 0;
      font-size: 18px;
    }
    #status .error {
      max-width: 640px;
      color: #ffb4a8;
      line-height: 1.4;
    }
    #hud {
      position: fixed;
      top: 6px;
      left: 6px;
      z-index: 3;
      padding: 6px 9px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.75);
      font: 12px/1.45 Consolas, monospace;
      white-space: pre;
      pointer-events: none;
    }
    #settings-button, #settings {
      position: fixed;
      z-index: 4;
      font-family: "Segoe UI", sans-serif;
    }
    #settings-button {
      top: 8px;
      right: 8px;
      padding: 6px 12px;
      border: 1px solid #6a5428;
      border-radius: 0;
      background: rgba(16, 12, 8, 0.88);
      color: #f2e2b0;
      cursor: pointer;
    }
    #settings {
      top: 44px;
      right: 8px;
      width: 260px;
      margin: 0;
      padding: 14px;
      border: 1px solid #6a5428;
      border-radius: 0;
      background: rgba(12, 10, 8, 0.94);
      color: #f4efe4;
    }
    #settings h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }
    #settings label {
      display: block;
      margin: 10px 0;
      font-size: 14px;
    }
    #settings select {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 4px;
      border-radius: 0;
    }
    #settings label:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div id="status"><p>Opening AdventureQuest Worlds…</p></div>
  <div id="game"></div>
  <button id="settings-button" type="button">Settings</button>
  <form id="settings" hidden>
    <h2>Settings</h2>
    <label><input name="hud" type="checkbox" /> Show HUD, FPS, and connection</label>
    <label>Resolution
      <select name="resolution">
        <option value="window">Window</option>
        <option value="960">960×550</option>
        <option value="75">75% (720×412)</option>
        <option value="50">50% (480×275)</option>
      </select>
    </label>
    <label>Renderer
      <select name="renderer">
        <option value="auto">Automatic</option>
        <option value="webgpu">WebGPU</option>
        <option value="wgpu-webgl">WebGL</option>
      </select>
    </label>
  </form>
  <script src="config.js"></script>
  <script src="vendor/ruffle.js"></script>
  <script src="player.js"></script>
</body>
</html>
